<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in to ScheduLink</title>
<meta name="robots" content="noindex, nofollow"><link rel="icon" href="../../../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../../assets/schedulink.css"><link rel="stylesheet" href="../../_shared.css"><style>body{background:var(--surface)}.sp{min-height:100vh;display:grid;grid-template-columns:5fr 7fr}

</head><body><main class="sp"><aside class="sp-l"><a href="https://schedulink.io/" aria-label="ScheduLink"><img src="../../../assets/wordmark-blue.png" alt="ScheduLink"></a><div><h2>The office side of your studio, in one system.</h2><p>Clients, jobs, photographers, tasks, emails and forms.</p></div><small>© 2026 ScheduLink</small></aside><section class="sp-r"><form class="ap-card" style="max-width:400px;width:100%" action="#" onsubmit="return false">

<p class="ap-lead">Log in to your studio.</p>
<label class="ap-f"><span class="ap-l">Email</span><input class="ap-i" type="email" autocomplete="email" required></label>

<div class="ap-row"><label class="ap-chk"><input type="checkbox"> Keep me logged in</label><a href="../../forgot-password/">Forgot password?</a></div>
<button class="ap-btn" type="submit">Log in</button>
<p class="ap-fine">By logging in you agree to ScheduLink's <a href="https://schedulink.io/terms/">Terms of Service</a> and <a href="https://schedulink.io/privacy/">Privacy Policy</a>.</p>
</form>
</section></main></body></html>
