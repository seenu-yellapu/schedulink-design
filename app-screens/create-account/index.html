<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create your ScheduLink account</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../assets/schedulink.css"><link rel="stylesheet" href="../_shared.css">
</head><body>
<main class="ap">
<a class="ap-logo" href="https://schedulink.io/" aria-label="ScheduLink"><img src="../../assets/wordmark-blue.png" alt="ScheduLink"></a>
<form class="ap-card" style="max-width:640px" action="#" onsubmit="return false">
<h1 class="ap-h1">Create your ScheduLink account.</h1>
<p class="ap-lead">Set up your company on ScheduLink.</p>
<div class="ap-2">
<div><p class="ap-sec">Your company</p>
<label class="ap-f"><span class="ap-l">Company name</span><input class="ap-i" type="text" autocomplete="organization" required></label>
<label class="ap-f"><span class="ap-l">Company email</span><input class="ap-i" type="email" required></label>
<label class="ap-f"><span class="ap-l">Phone <small>(optional)</small></span><input class="ap-i" type="tel" autocomplete="tel"></label></div>
<div><p class="ap-sec">You</p>
<label class="ap-f"><span class="ap-l">First name</span><input class="ap-i" type="text" autocomplete="given-name" required></label>
<label class="ap-f"><span class="ap-l">Last name</span><input class="ap-i" type="text" autocomplete="family-name" required></label>
<label class="ap-f"><span class="ap-l">Your email</span><input class="ap-i" type="email" autocomplete="email" required></label></div>
</div>
<div style="height:76px;border:1px solid var(--line);border-radius:var(--radius-md);display:flex;align-items:center;padding:0 16px;gap:12px;margin:4px 0 20px;color:var(--ink-secondary);font-size:14px"><span style="width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:4px;background:#fff"></span>I&#39;m not a robot<span style="margin-left:auto;font-size:11px;color:var(--ink-muted)">reCAPTCHA</span></div>
<button class="ap-btn" type="submit">Create account</button>
<p class="ap-fine">By signing up you agree to ScheduLink&#39;s <a href="https://schedulink.io/terms/">Terms of Service</a> and <a href="https://schedulink.io/privacy/">Privacy Policy</a>.</p>
<p class="ap-alt">Already have an account? <a href="../login/">Log in</a><br><span style="font-size:14px">Invited by your team? Use the link in your invite email.</span></p>
</form>
<p class="ap-foot">© 2026 ScheduLink</p>
</main>
</body></html>
