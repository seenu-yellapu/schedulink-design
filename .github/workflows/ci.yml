name: tokens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: rebuild every output and fail on drift, contrast or house style
        run: node scripts/tokens.mjs --check
