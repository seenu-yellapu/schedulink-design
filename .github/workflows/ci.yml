name: tokens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: rebuild every output and fail on drift, contrast or house style
        run: node scripts/tokens.mjs --check
